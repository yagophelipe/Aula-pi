<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Eventos</title>
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>

	<div class="container">

		<h1>Detalhes do Evento</h1>

		<div class="row">
			<div class="col s12 m6">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Informações do Evento</span>

						<p>
							<strong>ID: </strong><span th:text="${evento.id}">1</span>
						</p>
						<p>
							<strong>Nome: </strong><span th:text="${evento.nome}">Aniversário</span>
						</p>
						<p>
							<strong>Local: </strong><span th:text="${evento.local}">Clube</span>
						</p>
						<p>
							<strong>Data: </strong><span th:text="${evento.data}">20/20/2026</span>
						</p>
						<p>
							<strong>Horário: </strong><span th:text="${evento.horario}">19:00</span>
						</p>

					</div>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col s12 m6">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Adicionar Convidado</span>

						<form th:action="@{/eventos/{idEvento}(idEvento=${evento.id})}" method="post">

							<input type="hidden" name="id"
								th:value="${convidado != null ? convidado.id : ''}">

							<div>
								<label>Nome: </label>
								<input type="text" name="nome"
									th:value="${convidado != null ? convidado.nome : ''}">
							</div>
							<div>
								<label>RG: </label>
								<input type="text" name="rg"
									th:value="${convidado != null ? convidado.rg : ''}">
							</div>
							<div>
								<button type="submit" class="btn">Salvar</button>
								<button type="reset" class="btn">Limpar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col s12 m6">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Lista de Convidados</span>

						<table class="highlight">
							<thead>
								<tr>
									<th>Id</th>
									<th>Nome</th>
									<th>RG</th>
									<th>Ações</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="c : ${convidados}">
									<td th:text="${c.id}">1</td>
									<td th:text="${c.nome}">Yago</td>
									<td th:text="${c.rg}">1234</td>
									<td>
										<a th:href="@{/eventos/{idEvento}/convidados/{idConvidado}/selecionar(idEvento=${evento.id}, idConvidado=${c.id})}">
											<i class="material-icons">edit</i>
										</a>
										<a th:href="@{/eventos/{idEvento}/remover/{idConvidado}(idEvento=${evento.id}, idConvidado=${c.id})}">
											<i class="material-icons">delete</i>
										</a>
									</td>
								</tr>
							</tbody>
						</table>

					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
