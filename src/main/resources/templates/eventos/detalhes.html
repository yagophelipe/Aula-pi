<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Eventos</title>
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>


	<div class="container">

		<h1>detalhes do evento</h1>

		<div class="row">
			<div class="col s12 m6">
				<div class="card">
					<div class="card-content ">
						<span class="card-title">Card Title</span>

						<p>
							<strong>id: </strong><span th:text="${evento.id}">1</span>
						</p>
						<p>
							<strong>Nome: </strong><span th:text="${evento.nome}">aniverasrio</span>
						</p>
						<p>
							<strong>local: </strong><span th:text="${evento.local}">clube</span>
						</p>
						<p>
							<strong>Data: </strong><span th:text="${evento.data}">20/20/2026</span>
						</p>
						<p>
							<strong>Horario: </strong><span th:text="${evento.horario}">19:00</span>
						</p>

					</div>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col s12 m6">
				<div class="card">
					<div class="card-content ">
						<span class="card-title">Adicionar Convidado</span>
						<form action="" method="post">
							<div>
								<label>Nome: </label> <input type="text" name="nome">
							</div>
							<div>
								<label>RG: </label> <input type="text" name="rg">
							</div>
							<div>
								<button type="submit" class="btn">Salvar</button>
								<button type="reset" class="btn">Limpar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col s12 m6">
				<div class="card">
					<div class="card-content ">
						<span class="card-title">Lista de Convidados</span>

						<table class="highlight">
							<thead>
							<tr>
							<th>Id</th>
							<th>Nome</th>
							<th>RG</th>
							</tr>							
							</thead>
							<tbody>
							<tr th:each="c : ${convidados}">
							 	<td th:text="${c.id}">1</td>
							 	<th th:text="${c.nome}">Yago</th>
							 	<th th:text="${c.rg}">1234</th>
							</tr>
							</tbody>
						</table>

					</div>
				</div>
			</div>
		</div>
	</div>




</body>
</html>
